[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rivalsignal"
version = "0.1.0"
description = "Rival Signal: source-reviewed competitor research and response planning"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{name = "Ulrik Erlingsen"}]
dependencies = ["pandas>=2.0,<3", "jsonschema>=4.21,<5"]

[project.optional-dependencies]
ui = ["streamlit>=1.50,<2", "plotly>=5.18,<8"]
test = ["pytest>=8,<10", "ruff>=0.8,<1", "streamlit>=1.50,<2", "plotly>=5.18,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rivalsignal.ui" = ["assets/marks/*", "assets/fonts/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
"src/rivalsignal/ui/signal_theme.py" = ["E701", "E702"]
