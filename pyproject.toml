[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rivalsignal"
version = "1.0.0"
description = "Rival Signal: source-reviewed competitor research and response planning"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{name = "Ulrik Erlingsen"}]
keywords = [
  "competitor analysis",
  "competitive intelligence",
  "competitive dynamics",
  "source review",
  "marketing strategy",
  "marketing analytics",
  "streamlit",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["pandas>=2.0,<3", "jsonschema>=4.21,<5"]

[project.optional-dependencies]
ui = ["streamlit>=1.51,<2", "plotly>=5.18,<8"]
test = ["pytest>=8,<10", "ruff>=0.8,<1", "build>=1.2,<2", "streamlit>=1.51,<2", "plotly>=5.18,<8"]

[project.urls]
Homepage = "https://github.com/UlrikErlingsen/competitor-analysis"
Source = "https://github.com/UlrikErlingsen/competitor-analysis"
Issues = "https://github.com/UlrikErlingsen/competitor-analysis/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rivalsignal.ui" = ["assets/marks/*", "assets/fonts/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
"src/rivalsignal/ui/signal_theme.py" = ["E701", "E702"]
